<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" />
  <meta name="description" content="PitchSync AI — GenAI-powered dual-mode stadium operations & fan experience platform for the FIFA World Cup 2026." />
  <meta name="theme-color" content="#1E40AF" />
  <meta property="og:title" content="PitchSync AI" />
  <meta property="og:description" content="GenAI-powered dual-mode assistant for FIFA World Cup 2026 stadium operations & fan experience." />
  <meta property="og:type" content="website" />
  <title>PitchSync AI — FIFA World Cup 2026</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            fifa: {
              blue: '#1E40AF',
              'blue-dark': '#1E3A8A',
              gold: '#D4A843',
              'gold-light': '#F5E6C8',
            },
            surface: {
              50: '#FAFBFC',
              100: '#F1F5F9',
              200: '#E2E8F0',
              300: '#CBD5E1',
            },
            slate: {
              600: '#475569',
              700: '#334155',
              800: '#1E293B',
              900: '#0F172A',
            },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/src/styles/variables.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/fan-mode.css" />
  <link rel="stylesheet" href="/src/styles/ops-mode.css" />
</head>
<body class="bg-surface-50 text-slate-800 font-sans antialiased">
  <div id="app" role="application" aria-label="FIFA MatchDay GenAI Nexus">
    <!-- App shell rendered by main.js -->
    <div id="loading-screen" class="fixed inset-0 bg-surface-50 flex flex-col items-center justify-center z-50" role="status" aria-label="Loading application">
      <div class="relative mb-6">
        <div class="w-16 h-16 border-4 border-surface-200 border-t-fifa-blue rounded-full animate-spin"></div>
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-6 h-6 bg-fifa-gold rounded-full animate-pulse"></div>
        </div>
      </div>
      <h1 class="text-xl font-bold text-slate-800 mb-1">PitchSync AI</h1>
      <p class="text-sm text-slate-600">Initializing stadium intelligence...</p>
    </div>
  </div>
  <noscript>
    <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif;">
      <h1>PitchSync AI</h1>
      <p>This application requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
    </div>
  </noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
